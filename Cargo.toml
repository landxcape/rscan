[package]
name = "rscan"
version = "0.1.1"
edition = "2024"
description = "High-performance Layer 2 ARP & TCP port network scanner"
license = "MIT"
readme = "README.md"
repository = "https://github.com/landxcape/rscan"
keywords = ["network", "arp", "scanner", "port-scanner", "cli"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
comfy-table = "7.2.2"
ipnet = { version = "2.12.1", features = ["serde"] }
libc = "0.2.189"
manuf = "0.2.0"
pnet = "0.35.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
